<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>기록</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header class="topbar"><h1>기록</h1><div class="top-actions"><button id="settingsBtn" class="icon-btn" aria-label="백업 설정" title="백업 설정">⚙</button><button id="newBtn" class="icon-btn" aria-label="새 기록">＋</button></div></header>
<main>
<section class="toolbar"><input id="searchInput" type="search" placeholder="제목, 내용, 메모 검색"><div id="categoryBar" class="chips"></div></section>
<section id="recordList" class="record-list"></section><div id="emptyState" class="empty" hidden>기록이 없습니다.</div>
</main>
</div>
<dialog id="editorDialog"><form id="recordForm" class="editor">
<div class="editor-header"><button type="button" id="cancelBtn" class="text-btn">취소</button><h2 id="editorTitle">기록 작성</h2><button type="submit" class="save-btn">저장</button></div>
<input type="hidden" id="recordId">
<label>작성일<input id="dateInput" type="date" required></label>
<label>분류<input id="categoryInput" list="categoryOptions" placeholder="기존 분류 선택 또는 신규 입력" required><datalist id="categoryOptions"></datalist></label>
<label>제목<input id="titleInput" maxlength="100" placeholder="제목"></label>
<label>내용<textarea id="contentInput" rows="9" placeholder="내용을 입력하세요"></textarea></label>
<label>메모<textarea id="memoInput" rows="3" placeholder="메모"></textarea></label>
</form></dialog>
<dialog id="settingsDialog"><form id="settingsForm" class="settings-form"><div class="editor-header"><button type="button" id="settingsCancelBtn" class="text-btn">취소</button><h2>백업 설정</h2><button type="submit" class="save-btn">저장</button></div><p class="settings-help">Google 계정을 바꾸거나 다른 백업 시트를 사용하려면, 해당 Google 계정으로 배포한 Apps Script 웹 앱 주소를 입력하세요.</p><label>백업 연결 주소<input id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></label><label>계정 메모(선택)<input id="accountLabelInput" type="text" maxlength="50" placeholder="예: 개인 Google 계정"></label><div class="settings-status" id="settingsStatus"></div><button type="button" id="testBackupBtn" class="secondary-btn settings-test">연결 테스트</button></form></dialog>
<dialog id="detailDialog"><div class="detail"><div class="editor-header"><button id="detailCloseBtn" class="text-btn">닫기</button><h2>기록</h2><span></span></div><div id="detailBody"></div><div class="detail-actions"><button id="editBtn" class="secondary-btn">수정</button><button id="deleteBtn" class="danger-btn">삭제</button></div></div></dialog>
<script src="app.js?v=8"></script>
</body></html>
