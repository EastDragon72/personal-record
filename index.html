<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="application-name" content="개인 기록장">
<title>기록장</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app">
<header class="topbar"><h1>기록장</h1><div class="top-actions"><button id="settingsBtn" class="icon-btn" aria-label="백업 설정" title="백업 설정">⚙</button><button id="newBtn" class="icon-btn" aria-label="새 기록">＋</button></div></header>
<main>
<section class="toolbar"><input id="searchInput" type="search" placeholder="제목, 내용, 메모 검색"><div id="categoryBar" class="chips"></div></section>
<section id="recordList" class="record-list"></section><div id="emptyState" class="empty" hidden>기록이 없습니다.</div>
</main>
</div>
<dialog id="editorDialog"><form id="recordForm" class="editor">
<div class="editor-header"><span></span><h2 id="editorTitle">기록 작성</h2><span></span></div>
<div class="dialog-actions"><button type="button" id="cancelBtn" class="text-btn">닫기</button><button type="submit" class="save-btn">저장</button></div>
<input type="hidden" id="recordId">
<label>작성일<input id="dateInput" type="date" required></label>
<label>분류<input id="categoryInput" list="categoryOptions" placeholder="기존 분류 선택 또는 신규 입력" required><datalist id="categoryOptions"></datalist></label>
<label>제목<input id="titleInput" maxlength="100" placeholder="제목"></label>
<label>내용<textarea id="contentInput" rows="9" placeholder="내용을 입력하세요"></textarea></label>
<label>메모<textarea id="memoInput" rows="3" placeholder="메모"></textarea></label>
</form></dialog>
<dialog id="settingsDialog"><form id="settingsForm" class="settings-form">
<div class="editor-header"><span></span><h2>설정</h2><span></span></div>
<div class="dialog-actions"><button type="button" id="settingsCancelBtn" class="text-btn">닫기</button><button type="submit" class="save-btn">저장</button></div>
<section class="backup-card">
  <h3>Google 연결</h3>
  <label>Google 계정명<input id="accountNameInput" type="text" maxlength="50" placeholder="예: EastDragon" autocomplete="off"></label>
  <label>계정 이메일<input id="accountEmailInput" type="email" maxlength="100" placeholder="예: example@gmail.com" autocomplete="email"></label>
  <label>Google Sheets URL<input id="sheetUrlInput" type="url" placeholder="https://docs.google.com/spreadsheets/d/..." autocomplete="off"></label>
  <button type="button" id="connectGoogleBtn" class="secondary-btn settings-test">Google 계정 연결 / 전환</button>
  <button type="button" id="testBackupBtn" class="secondary-btn settings-test">연결 테스트</button>
</section>
<section class="backup-card app-info-card">
  <h3>앱 정보</h3>
  <div class="info-row"><span>파일명</span><strong>개인 기록장</strong></div>
  <div class="info-row"><span>버전</span><strong>v11.4.1</strong></div>
</section>
<div class="settings-status" id="settingsStatus"></div>
</form></dialog>
<dialog id="detailDialog"><div class="detail"><div class="editor-header"><span></span><h2>기록장</h2><span></span></div><div id="detailBody"></div><div class="detail-actions"><button id="detailCloseBtn" class="secondary-btn">닫기</button><button id="editBtn" class="secondary-btn">수정</button><button id="deleteBtn" class="danger-btn">삭제</button></div></div></dialog>
<script src="app.js?v=14"></script>
</body></html>
